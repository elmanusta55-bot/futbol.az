<!DOCTYPE html>
<html lang="az" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futbol.az | Offline</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .offline-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
    .offline-card{max-width:560px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
    .offline-card h1{margin-bottom:10px}
    .offline-card p{color:var(--text-muted);margin-bottom:14px}
  </style>
</head>
<body>
  <div class="offline-wrap">
    <div class="offline-card">
      <h1>📡 Offline rejim</h1>
      <p>İnternet bağlantısı bərpa olunandan sonra səhifəni yeniləyin.</p>
      <a class="btn-primary" href="/">Ana səhifəyə qayıt</a>
    </div>
  </div>
</body>
</html>
