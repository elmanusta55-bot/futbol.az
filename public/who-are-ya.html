<!DOCTYPE html>
<html lang="az" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Futbol.az – Who Are Ya? Futbolçu Tapmaca Oyunu">
  <title>Futbol.az | Who Are Ya? 🕵️</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── Who Are Ya page layout ─────────────────────────────── */
    .way-page {
      min-height: 100vh;
      padding: calc(var(--navbar-h) + 32px) 16px 64px;
      max-width: 560px;
      margin: 0 auto;
    }

    .way-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .way-header h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 900;
      margin-bottom: 6px;
    }

    .way-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .way-score-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 16px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .way-score-val {
      color: var(--blue-lt);
      font-weight: 800;
      font-size: 1.1rem;
    }

    /* Player card with canvas */
    .way-player-card {
      position: relative;
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .way-blur-wrap {
      border-radius: var(--radius);
      overflow: hidden;
      transition: filter 0.5s ease;
    }

    #way-canvas {
      display: block;
      border-radius: var(--radius);
    }

    /* Hints grid */
    .way-hints {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    @media (max-width: 400px) {
      .way-hints { grid-template-columns: repeat(2, 1fr); }
    }

    .way-hint {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 10px;
      text-align: center;
      transition: border-color 0.2s, background 0.2s;
    }

    .way-hint.way-hint-revealed {
      border-color: var(--blue);
      background: rgba(0,61,165,0.10);
    }

    .way-hint-label {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .way-hint-value {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Attempts */
    .way-attempts {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      letter-spacing: 0.04em;
    }

    /* Guess input area */
    .way-guess-area {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .way-input {
      flex: 1;
      padding: 11px 14px;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .way-input:focus { border-color: var(--blue); }

    .way-guess-btns {
      display: flex;
      gap: 8px;
    }

    .way-guess-btns .btn-primary,
    .way-guess-btns .btn-secondary {
      padding: 10px 16px;
      font-size: 0.85rem;
      border-radius: 10px;
      white-space: nowrap;
    }

    .way-guess-btns .btn-primary:disabled,
    .way-guess-btns .btn-secondary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Message */
    .way-msg {
      min-height: 22px;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 10px;
      border-radius: 8px;
      padding: 4px 10px;
    }

    .way-msg.correct { color: #27ae60; }
    .way-msg.wrong   { color: #e74c3c; }
    .way-msg.info    { color: var(--blue-lt); }
    .way-msg.warn    { color: #f1c40f; }

    /* Guess list */
    .way-guess-list {
      list-style: none;
      padding: 0;
      margin: 0 0 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 160px;
      overflow-y: auto;
    }

    .way-guess-item {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .way-guess-item.wrong   { background: rgba(231,76,60,0.12);  color: #e74c3c; }
    .way-guess-item.correct { background: rgba(39,174,96,0.15);  color: #27ae60; }

    /* Result overlay card */
    .way-result {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
      animation: fadeInUp 0.3s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .way-result-emoji { font-size: 3rem; margin-bottom: 8px; }
    .way-result-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .way-result-player {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .way-result-score {
      font-size: 1rem;
      font-weight: 700;
      color: var(--blue-lt);
      margin-bottom: 16px;
    }

    /* Loading state */
    .way-loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .way-loading .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ══════════════════ NAVBAR ══════════════════ -->
<header class="navbar" id="navbar">
  <div class="navbar-inner">
    <a class="navbar-logo" href="/" aria-label="Futbol.az ana səhifə">
      <div class="logo-icon">⚽</div>
      <span class="logo-text">Futbol<span class="logo-accent">.az</span></span>
    </a>

    <div class="navbar-actions">
      <button class="icon-btn" id="theme-btn" onclick="toggleWayTheme()" aria-label="Modu dəyiş" title="Gecə/Gündüz modu">
        <span id="theme-icon">🌙</span>
      </button>
      <button class="hamburger" id="hamburger" onclick="toggleWayMobileMenu()" aria-label="Mobil menyu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <div class="mobile-menu" id="mobile-menu" hidden>
    <a href="/">🏠 Ana Səhifə</a>
    <a href="/live.html">🔴 Canlı Matçlar</a>
    <a href="/who-are-ya.html" style="color:var(--blue-lt);font-weight:700;">🕵️ Who Are Ya?</a>
    <a href="/privacy.html">🔒 Məxfilik Siyasəti</a>
    <a href="/terms.html">📄 İstifadə Şərtləri</a>
  </div>
</header>

<!-- ══════════════════ MAIN ══════════════════ -->
<main>
  <div class="way-page">

    <!-- Header -->
    <div class="way-header">
      <h1>🕵️ Who Are Ya?</h1>
      <p>Bulanıq şəkli gör, ipuçlarından istifadə et, futbolçunu tap!</p>
    </div>

    <!-- Score bar -->
    <div class="way-score-bar">
      <span>🏆 Ümumi Xal:</span>
      <span class="way-score-val" id="way-score">0</span>
    </div>

    <!-- Loading state -->
    <div id="way-loading" hidden>
      <div class="way-loading">
        <div class="spinner"></div>
        <p>Oyun yüklənir…</p>
      </div>
    </div>

    <!-- Game area -->
    <div id="way-game" hidden>

      <!-- Player card -->
      <div class="way-player-card">
        <div class="way-blur-wrap" id="way-blur-wrap">
          <canvas id="way-canvas" width="200" height="260" role="img" aria-label="Futbolçu şəkli"></canvas>
        </div>
      </div>

      <!-- Hints -->
      <div class="way-hints" id="way-hints" aria-label="İpucular"></div>

      <!-- Attempts -->
      <div class="way-attempts" id="way-attempts"></div>

      <!-- Result overlay (shown when game ends) -->
      <div class="way-result" id="way-result" hidden>
        <div class="way-result-emoji" id="way-result-emoji">🎉</div>
        <div class="way-result-title" id="way-result-title">Düzgün tapdınız!</div>
        <div class="way-result-player" id="way-result-player"></div>
        <div class="way-result-score" id="way-result-score"></div>
        <button class="btn-primary" onclick="newGame()" style="margin: 0 auto; display: inline-flex;">
          🔄 Yeni Oyun
        </button>
      </div>

      <!-- Message -->
      <div class="way-msg" id="way-msg"></div>

      <!-- Guess input -->
      <div class="way-guess-area">
        <input
          type="text"
          id="way-input"
          class="way-input"
          placeholder="Futbolçunun adını yazın…"
          maxlength="60"
          autocomplete="off"
          aria-label="Futbolçu adı daxil edin"
        >
        <div class="way-guess-btns">
          <button class="btn-primary" id="way-submit-btn" onclick="checkGuess()">✅ Yoxla</button>
          <button class="btn-secondary" id="way-hint-btn" onclick="revealHint()" title="İpucu aç (xal azalır)">💡</button>
        </div>
      </div>

      <!-- Previous guesses -->
      <ul class="way-guess-list" id="way-guess-list" aria-label="Əvvəlki cavablar"></ul>

      <!-- New game button (always visible) -->
      <div style="text-align:center; margin-top: 8px;">
        <button class="btn-secondary" onclick="newGame()" style="font-size: 0.85rem; padding: 8px 20px;">
          ⏭️ Ötür / Yeni Oyun
        </button>
      </div>

    </div><!-- end #way-game -->

  </div><!-- end .way-page -->
</main>

<script src="who-are-ya.js"></script>
<script src="consent.js"></script>
</body>
</html>
