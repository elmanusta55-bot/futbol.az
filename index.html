<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol.Az | Canlı Hesablar Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8330893952904159"
         crossorigin="anonymous"></script>
</head>
<body>

<header class="live-scores-header">
    <div class="header-container">
        <div class="header-left">
            <div class="live-indicator">
                <div class="live-dot"></div>
                <span>CANLI</span>
            </div>
            <h1>⚽ Canlı Oyunlar & Qolçular</h1>
        </div>
        <div class="header-actions">
            <button class="refresh-btn" onclick="refreshScores()" title="Yenilə">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
                </svg>
                <span class="refresh-text">Yenilə</span>
            </button>
            <div class="last-update">
                <span id="last-update-time">-</span>
            </div>
        </div>
    </div>
</header>

<main class="live-scores-main">
    <div class="container">
        <div class="loading-state" id="loading-indicator">
            <div class="loading-spinner"></div>
            <p>Canlı nəticələr yüklənir...</p>
        </div>
        
        <div class="scores-content" id="scores-content">
            <div class="matches-grid" id="live-scores-content">
                <!-- Matches will be populated here -->
            </div>
            
            <div class="empty-state" id="empty-state" style="display: none;">
                <div class="empty-icon">⚽</div>
                <h3>Hazırda canlı oyun yoxdur</h3>
                <p>Yeni məçlər başladıqda bu səhifə avtomatik yenilənəcək</p>
            </div>
        </div>
    </div>
</main>

<script>
    const API_KEY = "5b40dc94de05e9a55e848b0c16da8e8c";
    let isRefreshing = false;
    
    // Enhanced refresh function with UI feedback
    async function refreshScores() {
        if (isRefreshing) return;
        
        isRefreshing = true;
        const refreshBtn = document.querySelector('.refresh-btn');
        const refreshText = document.querySelector('.refresh-text');
        const loadingIndicator = document.getElementById('loading-indicator');
        
        // Update UI to show refreshing state
        refreshBtn.classList.add('refreshing');
        refreshText.textContent = 'Yenilənir...';
        loadingIndicator.style.display = 'block';
        
        try {
            await updateScores();
            updateLastRefreshTime();
        } catch (error) {
            console.error('Refresh error:', error);
            showError('Yenileme zamanı xəta baş verdi');
        } finally {
            // Reset UI
            setTimeout(() => {
                refreshBtn.classList.remove('refreshing');
                refreshText.textContent = 'Yenilə';
                loadingIndicator.style.display = 'none';
                isRefreshing = false;
            }, 1000);
        }
    }

    async function updateScores() {
        try {
            const response = await fetch('https://v3.football.api-sports.io/fixtures?live=all', {
                method: 'GET',
                headers: { 'x-apisports-key': API_KEY }
            });
            
            const data = await response.json();
            const matches = data.response || [];

            if (matches.length === 0) {
                document.getElementById('scores-content').style.display = 'none';
                document.getElementById('empty-state').style.display = 'block';
                return;
            }

            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('scores-content').style.display = 'block';

            let html = '';
            matches.forEach(match => {
                // Extract goal scorers
                let homeScorers = [];
                let awayScorers = [];
                
                if (match.events) {
                    match.events.forEach(event => {
                        if (event.type === "Goal") {
                            let goalInfo = `${event.player.name} (${event.time.elapsed}')`;
                            if (event.team.id === match.teams.home.id) homeScorers.push(goalInfo);
                            else awayScorers.push(goalInfo);
                        }
                    });
                }

                const watchUrl = `https://www.google.com/search?q=${encodeURIComponent(match.teams.home.name + ' vs ' + match.teams.away.name + ' canlı izlə')}`;

                html += `
                    <div class="match-card">
                        <div class="match-card-header">
                            <div class="match-league">${match.league.name}</div>
                            <div class="match-status">
                                <div class="match-time-live">${match.fixture.status.elapsed}'</div>
                                <div class="live-badge">
                                    <div class="live-pulse"></div>
                                    CANLI
                                </div>
                            </div>
                        </div>
                        
                        <div class="match-teams">
                            <div class="team home-team">
                                <div class="team-name">${match.teams.home.name}</div>
                                <div class="team-logo">🏠</div>
                            </div>
                            
                            <div class="match-score-section">
                                <div class="score-display">
                                    <span class="score-home">${match.goals.home}</span>
                                    <span class="score-separator">-</span>
                                    <span class="score-away">${match.goals.away}</span>
                                </div>
                            </div>
                            
                            <div class="team away-team">
                                <div class="team-logo">✈️</div>
                                <div class="team-name">${match.teams.away.name}</div>
                            </div>
                        </div>

                        ${homeScorers.length > 0 || awayScorers.length > 0 ? `
                        <div class="match-scorers">
                            <div class="scorers-home">${homeScorers.join(', ')}</div>
                            <div class="scorers-separator">⚽</div>
                            <div class="scorers-away">${awayScorers.join(', ')}</div>
                        </div>
                        ` : ''}

                        <div class="match-actions">
                            <a href="${watchUrl}" target="_blank" class="watch-btn">
                                📺 CANLI BAX
                            </a>
                        </div>
                    </div>
                `;
            });

            document.getElementById('live-scores-content').innerHTML = html;
        } catch (error) {
            console.error('Error:', error);
            showError('Məlumatlar yüklənərkən xəta baş verdi');
        }
    }
    
    function updateLastRefreshTime() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('az-AZ', { 
            hour: '2-digit', 
            minute: '2-digit',
            second: '2-digit' 
        });
        document.getElementById('last-update-time').textContent = `Son yeniləmə: ${timeString}`;
    }
    
    function showError(message) {
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error-message';
        errorDiv.textContent = message;
        document.body.appendChild(errorDiv);
        setTimeout(() => errorDiv.remove(), 3000);
    }

    // Initialize
    updateScores();
    updateLastRefreshTime();
    
    // Auto-refresh every 30 seconds (reduced from 60)
    setInterval(() => {
        if (!isRefreshing) {
            updateScores();
            updateLastRefreshTime();
        }
    }, 30000);
</script>

</body>
</html>
