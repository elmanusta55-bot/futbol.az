<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol.Az - eFootball Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Saira+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --neon-green: #00ffcc; --neon-glow: 0 0 15px rgba(0, 255, 204, 0.6); --dark-bg: #02040a; --glass-bg: rgba(22, 27, 34, 0.8); --gold-gradient: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%); --text: #f0f6fc; --border: #30363d; }
        
        body { background: var(--dark-bg); background-image: radial-gradient(circle at center, #0b1c2c 0%, #02040a 70%); font-family: 'Saira Condensed', sans-serif; color: var(--text); margin: 0; padding: 0; padding-bottom: 80px; letter-spacing: 0.5px; }
        
        header { background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); padding: 15px 20px; border-bottom: 2px solid var(--neon-green); text-align: center; position: sticky; top: 0; z-index: 1000; }
        .logo { font-family: 'Rajdhani', sans-serif; font-size: 32px; font-weight: 900; color: var(--neon-green); text-transform: uppercase; letter-spacing: 3px; text-shadow: var(--neon-glow); }
        
        .main-container { max-width: 1200px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media(max-width: 992px) { .main-container { grid-template-columns: 1fr; } }
        
        .card { background: var(--glass-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
        .card-header { font-family: 'Rajdhani', sans-serif; font-size: 18px; color: var(--neon-green); padding-bottom: 10px; border-bottom: 1px solid #333; margin-bottom: 15px; font-weight: 700; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
        
        .btn-premium { background: var(--neon-green); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase; width: 100%; transition: 0.2s; box-shadow: var(--neon-glow); }
        .btn-gold { background: var(--gold-gradient); }
        .btn-outline { background: transparent; border: 2px solid var(--neon-green); color: var(--neon-green); width: auto; min-width: 80px; margin: 5px; }
        
        .score-val { font-size: 48px; font-weight: 900; color: #ffcc00; text-align: center; }
        .promo-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #000; color: #fff; text-align: center; margin-bottom: 10px; box-sizing: border-box; }

        /* NAV BAR */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(2, 4, 10, 0.95); border-top: 2px solid var(--neon-green); display: flex; z-index: 2000; }
        .nav-btn { flex: 1; padding: 12px 0; text-align: center; color: #777; cursor: pointer; font-family: 'Rajdhani', sans-serif; font-weight: bold; }
        .nav-btn.active { color: var(--neon-green); background: rgba(0, 255, 204, 0.1); }
        .nav-btn i { display: block; font-size: 20px; }

        /* eFOOTBALL MODAL & CARD DİZAYNI */
        #card-open-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 5000; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        #card-open-modal.show { display: flex; }

        .efootball-card { width: 280px; height: 400px; border-radius: 15px; position: relative; overflow: hidden; transform: scale(0.5); opacity: 0; transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #card-open-modal.show .efootball-card { transform: scale(1); opacity: 1; }

        .efootball-card.epic { border: 3px solid #ffcc00; background: linear-gradient(180deg, #1a1400 0%, #000 100%); box-shadow: 0 0 30px rgba(255, 204, 0, 0.5); }
        .efootball-card.highlight { border: 3px solid #00ffcc; background: linear-gradient(180deg, #001a1a 0%, #000 100%); box-shadow: 0 0 30px rgba(0, 255, 204, 0.5); }
        .efootball-card.standard { border: 3px solid #fff; background: #222; }

        .player-rating { position: absolute; top: 10px; left: 15px; font-size: 45px; font-weight: 900; color: #ffcc00; z-index: 2; font-family: 'Rajdhani'; }
        .player-position { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 5px; font-weight: bold; }
        .player-image { width: 100%; height: 80%; object-fit: cover; margin-top: 40px; }
        .player-info-block { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); padding: 15px; text-align: center; border-top: 1px solid #333; }
        .player-name { font-size: 20px; font-weight: bold; color: #fff; }
        .card-type-label { position: absolute; top: 45%; left: 0; background: #ffcc00; color: #000; padding: 2px 10px; font-size: 10px; font-weight: 900; border-radius: 0 10px 10px 0; }
        
        .close-modal-btn { position: absolute; top: 30px; right: 30px; background: red; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        .card-shine { position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); animation: shine 3s infinite; }
        @keyframes shine { 100% { left: 200%; } }
        
        #missions-container { display: none; max-width: 800px; margin: 20px auto; padding: 0 15px; }
    </style>
</head>
<body>

<header><div class="logo">FUTBOL.AZ</div></header>

<div class="main-container" id="main-container">
    <div class="left-content">
        <div class="card" style="text-align:center;">
            <div class="card-header"><i class="fas fa-gamepad"></i> PENALTİ OYUNU</div>
            <div id="game-msg" style="font-size:20px; margin-bottom:15px; font-weight:bold;">Topu küncə vur!</div>
            <button class="btn-premium btn-outline" onclick="oyna('SOL')">SOL</button>
            <button class="btn-premium btn-outline" onclick="oyna('MƏRKƏZ')">MƏRKƏZ</button>
            <button class="btn-premium btn-outline" onclick="oyna('SAĞ')">SAĞ</button>
        </div>

        <div class="card">
            <div class="card-header"><i class="fas fa-satellite-dish"></i> CANLI HESABLAR</div>
            <div id="api-box">📡 Məlumatlar gətirilir...</div>
        </div>
    </div>

    <div class="right-content">
        <div class="card" style="border: 2px solid #ffcc00;">
            <div class="card-header"><i class="fas fa-box-open"></i> ƏFSANƏLƏR PAKETİ</div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-premium" onclick="paketAc('ronaldo', 2000)">CR7 AÇ</button>
                <button class="btn-premium btn-gold" onclick="paketAc('messi', 2000)">LM10 AÇ</button>
            </div>
        </div>

        <div class="card" id="profile-card">
            <div class="card-header"><i class="fas fa-user"></i> PROFİL <span id="badge-ui"></span></div>
            <div class="score-val" id="score-ui">0</div>
            <p style="text-align:center;">Şans: <span id="sans-ui" style="color:red; font-weight:bold;">3</span></p>
            <input type="text" id="promo-input" class="promo-input" placeholder="PROMO KOD">
            <button class="btn-premium btn-gold" onclick="promoIslet()">KODU İŞLƏT</button>
        </div>
    </div>
</div>

<div id="missions-container">
    <div class="card">
        <h3>Gündəlik Hədiyyə</h3>
        <button class="btn-premium" onclick="gorevEt('daily', 500)">500 XAL AL</button>
    </div>
</div>

<div id="card-open-modal">
    <button class="close-modal-btn" onclick="closeCardModal()">BAĞLA</button>
    <div id="opened-card-container"></div>
</div>

<div class="bottom-nav">
    <div class="nav-btn active" id="nav-home" onclick="menyuDeyis('home')"><i class="fas fa-home"></i> ANA SƏHİFƏ</div>
    <div class="nav-btn" id="nav-missions" onclick="menyuDeyis('missions')"><i class="fas fa-tasks"></i> GÖRƏVLƏR</div>
</div>

<script>
    let xal = parseInt(localStorage.getItem('xal')) || 0;
    let sans = 3;
    let bitmisGorevler = JSON.parse(localStorage.getItem('gorevler')) || [];

    // OYUNÇU DATA - 30 NƏFƏR
    const messiData = [
        { name: "Lionel Messi", rating: 100, pos: "RWF", type: "epic", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Lionel_Messi_20180626.jpg/420px-Lionel_Messi_20180626.jpg" },
        { name: "Neymar Jr", rating: 98, pos: "LWF", type: "epic", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/Neymar_Jr_2018.jpg/420px-Neymar_Jr_2018.jpg" },
        { name: "Luis Suarez", rating: 96, pos: "CF", type: "highlight", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/61/Luis_Su%C3%A1rez_2018.jpg/420px-Luis_Su%C3%A1rez_2018.jpg" },
        { name: "Pedri", rating: 94, pos: "CMF", type: "highlight", img: "https://upload.wikimedia.org/wikipedia/commons/d/d7/Placeholder_player.svg" }
        // ... Buraya digər 26 oyunçunu əlavə edə bilərsən
    ];

    const ronaldoData = [
        { name: "C. Ronaldo", rating: 100, pos: "CF", type: "epic", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Cristiano_Ronaldo_20180620.jpg/420px-Cristiano_Ronaldo_20180620.jpg" },
        { name: "Karim Benzema", rating: 97, pos: "CF", type: "epic", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Karim_Benzema_2018.jpg/420px-Karim_Benzema_2018.jpg" },
        { name: "Luka Modric", rating: 98, pos: "CMF", type: "highlight", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/Luka_Modri%C4%B7_20180626.jpg/420px-Luka_Modri%C4%B7_20180626.jpg" }
        // ... Buraya digər 27 oyunçunu əlavə edə bilərsən
    ];

    function uiYenile() {
        document.getElementById('score-ui').innerText = xal.toLocaleString();
        document.getElementById('sans-ui').innerText = sans;
        localStorage.setItem('xal', xal);
    }

    function paketAc(tip, qiymet) {
        if (xal < qiymet) { alert("Xalın çatmır!"); return; }
        xal -= qiymet;
        uiYenile();

        let data = tip === 'messi' ? messiData : ronaldoData;
        let p = data[Math.floor(Math.random() * data.length)];

        const modal = document.getElementById('card-open-modal');
        const container = document.getElementById('opened-card-container');
        
        modal.classList.add('show');
        container.innerHTML = `
            <div class="efootball-card ${p.type}">
                <div class="card-shine"></div>
                <div class="player-rating">${p.rating}</div>
                <div class="player-position">${p.pos}</div>
                <img src="${p.img}" class="player-image">
                <div class="player-info-block">
                    <div class="player-name">${p.name}</div>
                </div>
                <div class="card-type-label">${p.type.toUpperCase()}</div>
            </div>
        `;
    }

    function closeCardModal() { document.getElementById('card-open-modal').classList.remove('show'); }

    function oyna(t) {
        if(sans <= 0) { alert("Şans bitdi!"); return; }
        sans--;
        let gk = ['SOL','MƏRKƏZ','SAĞ'][Math.floor(Math.random()*3)];
        if(t !== gk) { xal += 100; document.getElementById('game-msg').innerText = "⚽ QOL! +100"; }
        else { document.getElementById('game-msg').innerText = "❌ TUTDU!"; }
        uiYenile();
    }

    function promoIslet() {
        let val = document.getElementById('promo-input').value.toUpperCase();
        if(val === "ELMANUSTA") { xal += 100000; uiYenile(); alert("100K XAL VERİLDİ!"); }
    }

    function menyuDeyis(m) {
        document.getElementById('main-container').style.display = m === 'home' ? 'grid' : 'none';
        document.getElementById('missions-container').style.display = m === 'missions' ? 'block' : 'none';
        document.getElementById('nav-home').classList.toggle('active', m === 'home');
        document.getElementById('nav-missions').classList.toggle('active', m === 'missions');
    }

    window.onload = uiYenile;
</script>
</body>
</html>
