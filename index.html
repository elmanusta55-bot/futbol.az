<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol.Az | Canlı Hesablar</title>
    <style>
        /* Səhifə Stili */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Widget Konteyneri */
        #live-football-widget {
            width: 100%;
            max-width: 550px;
            background: #1e1e1e;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border: 1px solid #333;
        }

        /* Başlıq */
        .widget-header {
            background: linear-gradient(90deg, #d32f2f, #b71c1c);
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #ff5252;
        }

        /* Oyunların siyahısı */
        #live-scores-content {
            padding: 10px;
            max-height: 500px;
            overflow-y: auto;
        }

        /* Hər bir oyun sətri */
        .match-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #262626;
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 10px;
            transition: transform 0.2s;
        }

        .match-card:hover {
            transform: scale(1.02);
            background: #2d2d2d;
        }

        .team-name {
            flex: 1;
            font-size: 14px;
            font-weight: 600;
        }

        .home-team { text-align: right; padding-right: 10px; }
        .away-team { text-align: left; padding-left: 10px; }

        .score-box {
            flex: 0 0 100px;
            text-align: center;
        }

        .score {
            background: #000;
            color: #4caf50;
            font-size: 20px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #444;
            display: inline-block;
            min-width: 60px;
        }

        .match-time {
            color: #f44336;
            font-size: 12px;
            margin-top: 5px;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Scrollbar stili */
        #live-scores-content::-webkit-scrollbar { width: 6px; }
        #live-scores-content::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="live-football-widget">
        <div class="widget-header">
            🔴 Canlı Qarşılaşmalar
        </div>
        <div id="live-scores-content">
            <p style="text-align: center; color: #888; padding: 20px;">Yüklənir...</p>
        </div>
    </div>

    <script>
        // Sənin API Key-in
        const API_KEY = "5b40dc94de05e9a55e848b0c16da8e8c";
        const scoresContainer = document.getElementById('live-scores-content');

        async function fetchLiveScores() {
            const url = 'https://v3.football.api-sports.io/fixtures?live=all';
            
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'x-apisports-key': API_KEY
                    }
                });

                const data = await response.json();
                const matches = data.response || [];

                if (matches.length === 0) {
                    scoresContainer.innerHTML = "<p style='text-align:center; color: #aaa; padding: 30px;'>Hazırda canlı oyun yoxdur.</p>";
                    return;
                }

                let html = '';
                matches.forEach(match => {
                    const home = match.teams.home;
                    const away = match.teams.away;
                    const goalsHome = match.goals.home ?? 0;
                    const goalsAway = match.goals.away ?? 0;
                    const elapsed = match.fixture.status.elapsed;

                    html += `
                        <div class="match-card">
                            <div class="team-name home-team">${home.name}</div>
                            <div class="score-box">
                                <div class="score">${goalsHome} - ${goalsAway}</div>
                                <div class="match-time">${elapsed}'</div>
                            </div>
                            <div class="team-name away-team">${away.name}</div>
                        </div>
                    `;
                });

                scoresContainer.innerHTML = html;

            } catch (error) {
                console.error("Xəta:", error);
                scoresContainer.innerHTML = "<p style='text-align:center; color:#f44336; padding: 20px;'>Xəta baş verdi. İnterneti və ya API limitini yoxlayın.</p>";
            }
        }

        // İlk yükləmə
        fetchLiveScores();

        // 1 dəqiqədən bir yenilə
        setInterval(fetchLiveScores, 60000);
    </script>
</body>
</html>
