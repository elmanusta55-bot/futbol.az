<!DOCTYPE html>

<head>

         crossorigin="anonymous"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="google-site-verification" content="yfd1nTk5KYcOXH0tRVciOxFtmU_mUBrc50cNzAUM1ZQ" />

    <title>Futbol.Az - Canlı Nəticələr və Mağaza</title>

    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #020617; color: #fff; text-align: center; }
        .container { max-width: 650px; margin: auto; padding: 20px; }
        .header { background: #1e293b; padding: 25px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #334155; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .balance-box { font-size: 32px; color: #2ecc71; font-weight: bold; margin-top: 10px; text-shadow: 0 0 10px rgba(46, 204, 113, 0.3); }
        .section { background: #0f172a; padding: 20px; border-radius: 15px; border: 1px solid #1e293b; margin-bottom: 20px; }
        .btn { background: #3498db; color: #fff; border: none; padding: 15px 25px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; margin: 5px; }
        .btn:hover { background: #2980b9; transform: translateY(-2px); }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .shop-item { background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid #334155; transition: 0.3s; }
        .shop-item:hover { border-color: #f1c40f; }
        .price { color: #f1c40f; font-weight: bold; display: block; margin: 10px 0; font-size: 18px; }
        #game-status { height: 25px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 style="margin:0; color: #2ecc71; letter-spacing: 2px;">FUTBOL.AZ</h1>
            <p style="color: #94a3b8; margin: 10px 0 5px 0;">Sənin Balansın:</p>
            <div class="balance-box"><span id="balance">0</span> XAL</div>
        </div>

        <div class="section">
            <h3 style="margin-top:0; color: #3498db;">🧤 PENALTİ YARIŞI</h3>
            <p id="game-status">Topu hara vurursan?</p>
            <div style="display: flex; justify-content: center; gap: 10px;">
                <button class="btn" onclick="shoot('SOL')">SOL</button>
                <button class="btn" onclick="shoot('MƏRKƏZ')">MƏRKƏZ</button>
                <button class="btn" onclick="shoot('SAĞ')">SAĞ</button>
            </div>
        </div>

        <div class="section">
            <h3 style="margin-top:0; color: #f1c40f;">🛒 MAĞAZA (SHOP)</h3>
            <div class="shop-grid">
                <div class="shop-item">
                    <div style="font-size: 30px;">👟</div>
                    <span style="font-weight: bold;">Qızıl Butsi</span>
                    <span class="price">500 Xal</span>
                    <button class="btn" style="background:#f1c40f; color:#000; width:100%;" onclick="buy('Qızıl Butsi', 500)">AL</button>
                </div>
                <div class="shop-item">
                    <div style="font-size: 30px;">👕</div>
                    <span style="font-weight: bold;">Qarabağ Forması</span>
                    <span class="price">1000 Xal</span>
                    <button class="btn" style="background:#f1c40f; color:#000; width:100%;" onclick="buy('Qarabağ Forması', 1000)">AL</button>
                </div>
            </div>
        </div>

        <div id="google_translate_element"></div>
    </div>

    <script type="text/javascript">
        // BALANS SİSTEMİ (Local Storage)
        let score = localStorage.getItem('futbol_az_score') ? parseInt(localStorage.getItem('futbol_az_score')) : 0;

        function updateUI() {
            document.getElementById('balance').innerText = score;
        }

        // PENALTİ MƏNTİQİ
        function shoot(user) {
            const choices = ['SOL', 'MƏRKƏZ', 'SAĞ'];
            const gk = choices[Math.floor(Math.random() * 3)];
            const status = document.getElementById('game-status');

            if (user === gk) {
                status.innerText = "❌ Qapıçı " + gk + " tərəfi tutdu!";
                status.style.color = "#e74c3c";
            } else {
                score += 100;
                localStorage.setItem('futbol_az_score', score);
                status.innerText = "⚽ GOOOL! +100 XAL!";
                status.style.color = "#2ecc71";
                updateUI();
            }
        }

        // MAĞAZA MƏNTİQİ
        function buy(name, price) {
            if (score >= price) {
                score -= price;
                localStorage.setItem('futbol_az_score', score);
                updateUI();
                alert("✅ Təbriklər! " + name + " uğurla alındı.");
            } else {
                alert("❌ Xalın kifayət deyil! Daha çox qol vur.");
            }
        }

        // GOOGLE TRANSLATE İNİT
        function googleTranslateElementInit() {
          new google.translate.TranslateElement({pageLanguage: 'az', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
        }

        updateUI();
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
