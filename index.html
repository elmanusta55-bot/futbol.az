<!DOCTYPE html>
<html lang="az">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="yfd1nTk5KYcOXH0tRVciOxFtmU_mUBrc50cNzAUM1ZQ" />

    <meta name="description" content="Azərbaycan Premyer Liqası: Canlı nəticələr, Mağaza və Oyunlar.">

    <title>Futbol.Az - Premium Portal</title>

    <style>
        :root { --neon-green: #2ecc71; --dark-bg: #050a14; --card-bg: #0f172a; --accent: #3498db; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--dark-bg); color: #fff; overflow-x: hidden; }
        
        /* HEADER */
        header { background: linear-gradient(180deg, #1e293b 0%, var(--dark-bg) 100%); padding: 30px 10px; border-bottom: 2px solid var(--neon-green); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .logo { font-size: 32px; font-weight: 900; color: var(--neon-green); text-transform: uppercase; letter-spacing: 3px; margin: 0; }
        
        /* BALANS KARTI */
        .balance-card { background: var(--card-bg); margin: -25px auto 20px; width: 85%; max-width: 400px; padding: 20px; border-radius: 20px; border: 1px solid #1e293b; box-shadow: 0 15px 35px rgba(0,0,0,0.4); position: relative; z-index: 10; }
        .balance-label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .balance-val { font-size: 36px; font-weight: bold; color: var(--neon-green); margin: 5px 0; }

        /* SECTIONS */
        .container { max-width: 600px; margin: auto; padding: 10px; }
        .section-title { text-align: left; font-size: 14px; color: #64748b; margin: 25px 0 10px 15px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .card { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid #1e293b; margin-bottom: 15px; }

        /* OYUN DÜYMƏLƏRİ */
        .game-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .btn-shoot { background: #1e293b; border: 1px solid var(--accent); color: #fff; padding: 15px 5px; border-radius: 12px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .btn-shoot:active { transform: scale(0.9); background: var(--accent); }

        /* MAĞAZA İTEMS */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .shop-item { background: #151c2c; padding: 15px; border-radius: 15px; border: 1px solid #1e293b; transition: 0.3s; }
        .shop-item:hover { border-color: var(--neon-green); }
        .item-icon { font-size: 40px; margin-bottom: 10px; display: block; }
        .buy-btn { background: var(--neon-green); color: #000; width: 100%; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        #msg { height: 20px; font-size: 14px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1 class="logo">FUTBOL.AZ</h1>
    </header>

    <div class="balance-card">
        <span class="balance-label">Mövcud Balans</span>
        <div class="balance-val"><span id="bal">0</span> <small style="font-size: 14px;">XAL</small></div>
    </div>

    <div class="container">
        
        <div class="section-title"><span>🧤</span> OYUN SAHƏSİ</div>
        <div class="card">
            <h3 style="margin-top:0;">Penalti Atışı</h3>
            <p id="msg">Qol vur, xal qazan!</p>
            <div class="game-grid">
                <button class="btn-shoot" onclick="play('SOL')">SOL</button>
                <button class="btn-shoot" onclick="play('MƏRKƏZ')">MƏRKƏZ</button>
                <button class="btn-shoot" onclick="play('SAĞ')">SAĞ</button>
            </div>
        </div>

        <div class="section-title"><span>🛒</span> VİRTUAL MAĞAZA</div>
        <div class="card">
            <div class="shop-grid">
                <div class="shop-item">
                    <span class="item-icon">👟</span>
                    <b>Qızıl Butsi</b><br>
                    <small style="color: #f1c40f;">500 XAL</small>
                    <button class="buy-btn" onclick="buy('Qızıl Butsi', 500)">AL</button>
                </div>
                <div class="shop-item">
                    <span class="item-icon">👕</span>
                    <b>Qarabağ Forması</b><br>
                    <small style="color: #f1c40f;">1000 XAL</small>
                    <button class="buy-btn" onclick="buy('Qarabağ Forması', 1000)">AL</button>
                </div>
            </div>
        </div>

        <div id="google_translate_element"></div>
    </div>

    <script>
        let score = localStorage.getItem('futbol_az_v3') ? parseInt(localStorage.getItem('futbol_az_v3')) : 0;
        const balEl = document.getElementById('bal');
        const msgEl = document.getElementById('msg');

        function update() {
            balEl.innerText = score.toLocaleString();
            localStorage.setItem('futbol_az_v3', score);
        }

        function play(user) {
            const gk = ['SOL', 'MƏRKƏZ', 'SAĞ'][Math.floor(Math.random() * 3)];
            if (user === gk) {
                msgEl.innerText = "❌ Qapıçı tutdu!";
                msgEl.style.color = "#ff4757";
            } else {
                score += 100;
                msgEl.innerText = "⚽ QOOOL! +100 XAL";
                msgEl.style.color = "#2ecc71";
                update();
            }
        }

        function buy(name, price) {
            if (score >= price) {
                score -= price;
                update();
                alert("✅ " + name + " alındı!");
            } else {
                alert("❌ Xalın yetmir!");
            }
        }

        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'az'}, 'google_translate_element');
        }

        update();
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
