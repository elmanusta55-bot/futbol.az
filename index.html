<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol.Az - Canlı API Portalı</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q79WE0TMKH"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-Q79WE0TMKH');</script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8330893952904159" crossorigin="anonymous"></script>

    <style>
        :root { --main: #00ff88; --dark: #050a14; --card: #111827; --gold: #f1c40f; --danger: #ff4757; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--dark); color: #fff; }
        
        header { background: #000; padding: 20px; border-bottom: 3px solid var(--main); text-align: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 5px 20px rgba(0,255,136,0.2); }
        .logo { font-size: 32px; font-weight: 900; color: var(--main); letter-spacing: 3px; margin: 0; }
        
        .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
        @media(max-width: 900px) { .container { grid-template-columns: 1fr; } }

        .card { background: var(--card); border: 1px solid #1f2937; border-radius: 16px; padding: 25px; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .card-title { font-size: 18px; color: var(--main); border-bottom: 2px solid #1f2937; padding-bottom: 12px; margin: 0 0 20px 0; font-weight: 900; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }

        /* API CƏDVƏL DİZAYNI */
        .api-table { width: 100%; border-collapse: collapse; font-size: 14px; background: #000; border-radius: 10px; overflow: hidden; }
        .api-table th { background: #1f2937; color: var(--main); padding: 15px 10px; font-weight: 900; text-align: center; }
        .api-table td { padding: 15px 10px; border-bottom: 1px solid #1f2937; text-align: center; font-weight: bold; }
        .api-table tr:hover { background: #0a0f1a; }
        .team-logo { width: 25px; height: 25px; vertical-align: middle; margin-right: 10px; }
        .team-name { text-align: left !important; display: flex; align-items: center; }

        /* YÜKLƏNİR (LOADER) */
        .loader { text-align: center; padding: 40px; color: var(--main); font-weight: bold; font-size: 18px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* OYUN VƏ BALANS */
        .bal-val { font-size: 45px; color: var(--gold); font-weight: 900; text-align: center; margin: 10px 0; }
        .btn { background: var(--main); color: #000; border: none; padding: 15px; border-radius: 10px; font-weight: 900; cursor: pointer; width: 100%; font-size: 15px; transition: 0.3s; margin-bottom: 10px; text-transform: uppercase; }
        .btn:active { transform: scale(0.95); }
        
        .game-btns { display: flex; gap: 10px; margin-top: 15px; }
        .game-btns .btn { background: transparent; border: 2px solid var(--main); color: var(--main); }
        .game-btns .btn:hover { background: var(--main); color: #000; }

        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .shop-item { background: #050a14; padding: 20px; text-align: center; border-radius: 12px; border: 1px solid #1f2937; }
        .shop-item .price { color: var(--gold); font-weight: bold; font-size: 18px; margin: 10px 0; display: block; }
    </style>
</head>
<body>

    <header><h1 class="logo">FUTBOL.AZ</h1></header>

    <div class="container">
        
        <div class="main-content">
            
            <div class="card">
                <h2 class="card-title">📡 CANLI API: PREMYER LİQA CƏDVƏLİ</h2>
                <div id="api-standings-container">
                    <div class="loader">Məlumatlar Serverdən Yüklənir... ⚽</div>
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">🔥 CANLI OYUNLAR (API)</h2>
                <div id="api-live-matches">
                    <div class="loader">Canlı Oyunlar Axtarılır... 📡</div>
                </div>
            </div>

        </div>

        <div class="sidebar">
            
            <div class="card" style="background: linear-gradient(135deg, #0f172a, #000); border-color: var(--gold);">
                <div style="font-size: 14px; color: #aaa; text-align: center; font-weight: bold;">MÖVCUD BALANSINIZ</div>
                <div class="bal-val" id="u-bal">0</div>
                <button class="btn" style="background: var(--gold);" onclick="window.usePromo()">PROMOKOD DAXİL ET</button>
            </div>

            <div class="card">
                <h2 class="card-title">🧤 PENALTİ YARIŞI</h2>
                <div style="background: #000; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-weight: bold;">
                    Şans: <span id="ch-val" style="color: var(--danger);">3</span> / 3
                </div>
                <p id="game-msg" style="text-align: center; height: 20px; font-weight: bold; margin: 0;">TOPU HARA VURURSAN?</p>
                <div class="game-btns">
                    <button class="btn" onclick="window.playGame('SOL')">SOL</button>
                    <button class="btn" onclick="window.playGame('MƏRKƏZ')">MƏRKƏZ</button>
                    <button class="btn" onclick="window.playGame('SAĞ')">SAĞ</button>
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">🛒 MAĞAZA</h2>
                <div class="shop-grid">
                    <div class="shop-item">
                        <div style="font-size: 35px;">👕</div>
                        <div style="font-weight: bold; margin-top: 5px;">Qarabağ Forması</div>
                        <span class="price">1000 XAL</span>
                        <button class="btn" id="btn-q1" onclick="window.buyItem('q1', 1000)">AL</button>
                    </div>
                    <div class="shop-item">
                        <div style="font-size: 35px;">👑</div>
                        <div style="font-weight: bold; margin-top: 5px;">VİP Status</div>
                        <span class="price">5000 XAL</span>
                        <button class="btn" id="btn-vip" onclick="window.buyItem('vip', 5000)">AL</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ==========================================
        // 1. APİ KODUNU BURAYA YAZ !!!
        // ==========================================
        const API_KEY = "VWu2sDI43xzsqIX3"; // <-- " " işarələri arasına kodunu yapışdır!
        
        // Məşhur API-Sports üçün ayarlar
        const myHeaders = new Headers();
        myHeaders.append("x-apisports-key", API_KEY);

        const requestOptions = {
            method: 'GET',
            headers: myHeaders,
            redirect: 'follow'
        };

        // ==========================================
        // 2. API-dən CƏDVƏLİ GƏTİRƏN FUNKSİYA
        // ==========================================
        async function fetchStandings() {
            const container = document.getElementById('api-standings-container');
            
            // Əgər API kodu boşdursa, xəbərdarlıq ver və default cədvəli göstər
            if(API_KEY === "VWu2sDI43xzsqIX3" || API_KEY === "") {
                container.innerHTML = `
                    <div style="background:#ff4757; color:#fff; padding:15px; border-radius:10px; text-align:center; font-weight:bold; margin-bottom:15px;">
                        ⚠️ DİQQƏT: API kodu daxil edilməyib! Kodu HTML faylının ən aşağısına yapışdırın.
                    </div>
                    ${getDefaultTable()}
                `;
                return;
            }

            try {
                // Azərbaycan Premyer Liqası ID: 134, Sezon: 2025 (4 Mart 2026-cı il üçün cari sezon)
                const response = await fetch("https://v3.football.api-sports.io/standings?league=134&season=2025", requestOptions);
                const data = await response.json();

                if(data.errors && data.errors.length > 0 || data.results === 0) {
                    container.innerHTML = `<div style="color:red; text-align:center;">API Xətası: ${JSON.stringify(data.errors)}. (Və ya liqa tapılmadı)</div>${getDefaultTable()}`;
                    return;
                }

                const standings = data.response[0].league.standings[0];
                let tableHTML = `<table class="api-table">
                    <tr><th>#</th><th class="team-name">KOMANDA</th><th>O</th><th>Q</th><th>H</th><th>M</th><th>XAL</th></tr>`;
                
                standings.forEach(team => {
                    tableHTML += `
                        <tr>
                            <td>${team.rank}</td>
                            <td class="team-name">
                                <img src="${team.team.logo}" class="team-logo" alt="logo">
                                ${team.team.name}
                            </td>
                            <td>${team.all.played}</td>
                            <td>${team.all.win}</td>
                            <td>${team.all.draw}</td>
                            <td>${team.all.lose}</td>
                            <td style="color:var(--main); font-size:16px;">${team.points}</td>
                        </tr>
                    `;
                });
                tableHTML += `</table>`;
                container.innerHTML = tableHTML;

            } catch (error) {
                console.log('API Fetch Error:', error);
                container.innerHTML = `<div style="color:#ff4757; text-align:center;">İnternet və ya API bağlantısı yoxdur.</div>${getDefaultTable()}`;
            }
        }

        // Default Cədvəl (API işləməyəndə görünən ehtiyat plan)
        function getDefaultTable() {
            return `
                <table class="api-table">
                    <tr><th>#</th><th class="team-name">KOMANDA</th><th>XAL</th></tr>
                    <tr><td>1</td><td class="team-name">🐎 Qarabağ FK</td><td style="color:var(--main);">55</td></tr>
                    <tr><td>2</td><td class="team-name">🦉 Sabah FK</td><td style="color:var(--main);">48</td></tr>
                    <tr><td>3</td><td class="team-name">🏁 Neftçi PFK</td><td style="color:var(--main);">42</td></tr>
                </table>
            `;
        }

        // ==========================================
        // 3. OYUN VƏ MAĞAZA SİSTEMİ (Yerli Yaddaş)
        // ==========================================
        let score = localStorage.getItem('api_score') ? parseInt(localStorage.getItem('api_score')) : 0;
        let chances = localStorage.getItem('api_chances') ? parseInt(localStorage.getItem('api_chances')) : 3;
        let inv = localStorage.getItem('api_inv') ? JSON.parse(localStorage.getItem('api_inv')) : [];

        // Günlük şans yenilənməsi
        let today = new Date().toLocaleDateString();
        if (localStorage.getItem('api_date') !== today) {
            chances = 3;
            localStorage.setItem('api_date', today);
        }

        window.updateUI = function() {
            document.getElementById('u-bal').innerText = score.toLocaleString();
            document.getElementById('ch-val').innerText = chances;
            
            inv.forEach(id => {
                let btn = document.getElementById('btn-' + id);
                if (btn) {
                    btn.innerText = "AKTİVDİR ✅";
                    btn.disabled = true;
                    btn.style.background = "#2ecc71";
                    btn.style.color = "#000";
                }
            });

            localStorage.setItem('api_score', score);
            localStorage.setItem('api_chances', chances);
            localStorage.setItem('api_inv', JSON.stringify(inv));
        };

        window.playGame = function(dir) {
            if (chances <= 0) { alert("Bu günlük şansınız bitdi!"); return; }
            chances--;
            const gk = ['SOL', 'MƏRKƏZ', 'SAĞ'][Math.floor(Math.random() * 3)];
            const msg = document.getElementById('game-msg');

            if (dir === gk) {
                msg.innerText = "❌ Qapıçı tutdu!";
                msg.style.color = "var(--danger)";
            } else {
                score += 100;
                msg.innerText = "⚽ QOOOL! +100 XAL";
                msg.style.color = "var(--main)";
            }
            window.updateUI();
        };

        window.buyItem = function(id, price) {
            if (score >= price) {
                score -= price;
                inv.push(id);
                window.updateUI();
                alert("Məhsul aktivləşdirildi!");
            } else {
                alert("Xalınız kifayət etmir!");
            }
        };

        window.usePromo = function() {
            let code = prompt("Promokodu daxil edin:");
            if (code && code.toUpperCase() === "ELMANUSTA") {
                score += 20000000;
                window.updateUI();
                alert("Təbriklər! 20000000 XAL əlavə olundu!");
            } else {
                alert("Keçərsiz və ya istifadə olunmuş kod!");
            }
        };

        // Səhifə açılanda sistemləri başlat
        window.onload = function() {
            window.updateUI();
            fetchStandings();
        };
    </script>
</body>
</html>
