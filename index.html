<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol.Az - Tam İşlək Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Saira+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --neon-green: #00ffcc; --neon-glow: 0 0 15px rgba(0, 255, 204, 0.6); --dark-bg: #02040a; --glass-bg: rgba(22, 27, 34, 0.8); --gold-gradient: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%); --text: #f0f6fc; --border: #30363d; }
        body { background: var(--dark-bg); background-image: radial-gradient(circle at center, #0b1c2c 0%, #02040a 70%); font-family: 'Saira Condensed', sans-serif; color: var(--text); margin: 0; padding: 0; letter-spacing: 0.5px; }
        header { background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); padding: 15px 20px; border-bottom: 2px solid var(--neon-green); text-align: center; position: sticky; top: 0; z-index: 1000; box-shadow: var(--neon-glow); }
        .logo { font-family: 'Rajdhani', sans-serif; font-size: 32px; font-weight: 900; color: var(--neon-green); text-transform: uppercase; letter-spacing: 3px; text-shadow: var(--neon-glow); }
        .main-container { max-width: 1200px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media(max-width: 992px) { .main-container { grid-template-columns: 1fr; } }
        .card { background: var(--glass-bg); backdrop-filter: blur(10px); padding: 20px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
        .card-header { font-family: 'Rajdhani', sans-serif; font-size: 18px; color: var(--neon-green); padding-bottom: 10px; border-bottom: 1px solid #333; margin-bottom: 15px; font-weight: 700; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
        .btn-premium { background: var(--neon-green); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase; width: 100%; transition: 0.2s; box-shadow: var(--neon-glow); }
        .btn-premium:active { transform: scale(0.95); }
        .btn-gold { background: var(--gold-gradient); box-shadow: 0 0 15px rgba(255, 153, 0, 0.4); }
        .btn-outline { background: transparent; border: 2px solid var(--neon-green); color: var(--neon-green); box-shadow: none; margin: 5px; width: auto; min-width: 80px; }
        .score-val { font-size: 48px; font-weight: 900; color: #ffcc00; text-shadow: 0 0 15px rgba(255, 204, 0, 0.4); text-align: center; margin: 10px 0; }
        .promo-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #000; color: #fff; text-align: center; font-weight: bold; margin-bottom: 10px; outline: none; box-sizing: border-box; }
        .live-match { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; border-left: 3px solid var(--neon-green); display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .timer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; text-align: center; }
        .time-block { background: #000; padding: 10px; border-radius: 8px; border: 1px solid #333; }
        .vote-item { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; border: 1px solid transparent; }
        .vote-item:hover { border-color: var(--neon-green); }
        .vote-bar { height: 8px; background: #222; border-radius: 4px; margin-top: 8px; overflow: hidden; }
        .vote-fill { height: 100%; background: var(--neon-green); width: 0%; transition: 0.8s; }
        .search-box { width: 100%; padding: 15px; border-radius: 10px; border: 2px solid var(--neon-green); background: #000; color: #fff; font-size: 16px; outline: none; margin-bottom: 20px; box-sizing: border-box; box-shadow: var(--neon-glow); }
    </style>
</head>
<body>

<header><div class="logo">FUTBOL.AZ</div></header>

<div class="main-container">
    <div class="left-content">
        <input type="text" id="searchInput" class="search-box" placeholder="Komanda axtar..." onkeyup="axtar()">
        
        <div class="card">
            <div class="card-header"><i class="fas fa-satellite-dish"></i> CANLI OYUNLAR (API)</div>
            <div id="api-box">📡 Yüklənir...</div>
        </div>

        <div class="card" style="text-align:center;">
            <div class="card-header"><i class="fas fa-gamepad"></i> PENALTİ OYUNU</div>
            <div id="game-msg" style="font-size:20px; margin-bottom:15px; font-weight:bold;">Topu küncə vur!</div>
            <button class="btn-premium btn-outline" onclick="oyna('SOL')">SOL</button>
            <button class="btn-premium btn-outline" onclick="oyna('MƏRKƏZ')">MƏRKƏZ</button>
            <button class="btn-premium btn-outline" onclick="oyna('SAĞ')">SAĞ</button>
        </div>
<div class="card">
    <div class="card-header"><i class="fas fa-shopping-cart"></i> MEQA MAĞAZA</div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px;">
        
        <div class="shop-item" style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #333;">
            <div style="font-size: 30px;">👕</div>
            <h4 style="margin: 10px 0; font-size: 14px;">Qarabağ Forması</h4>
            <button class="btn-premium btn-gold" id="btn-qarabag" onclick="al('qarabag', 1000)">1,000 XAL</button>
        </div>

        <div class="shop-item" style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #333;">
            <div style="font-size: 30px;">👟</div>
            <h4 style="margin: 10px 0; font-size: 14px;">Qızıl Butsu</h4>
            <button class="btn-premium btn-gold" id="btn-butsu" onclick="al('butsu', 50000)">50,000 XAL</button>
        </div>

        <div class="shop-item" style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #333;">
            <div style="font-size: 30px;">👑</div>
            <h4 style="margin: 10px 0; font-size: 14px;">VİP Status</h4>
            <button class="btn-premium btn-gold" id="btn-vip" onclick="al('vip', 500000)">500,000 XAL</button>
        </div>

        <div class="shop-item" style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #333;">
            <div style="font-size: 30px;">⚽</div>
            <h4 style="margin: 10px 0; font-size: 14px;">Efsanəvi Top</h4>
            <button class="btn-premium btn-gold" id="btn-ball" onclick="al('ball', 1000000)">1M XAL</button>
        </div>

        <div class="shop-item" style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #333; grid-column: span 2;">
            <div style="font-size: 30px;">🏟️</div>
            <h4 style="margin: 10px 0; font-size: 14px;">Stadium Fonu (Xüsusi)</h4>
            <button class="btn-premium btn-gold" id="btn-bg" onclick="al('bg', 5000000)">5M XAL</button>
        </div>

    </div>
</div>

<script>
    // Bütün funksiyaları dəstəkləyən yenilənmiş UI funksiyası
    function uiYenile() {
        document.getElementById('score-ui').innerText = xal.toLocaleString();
        document.getElementById('sans-ui').innerText = sans;
        let bUI = document.getElementById('badge-ui');
        let card = document.getElementById('profile-card');
        let body = document.body;
        
        bUI.innerText = "";
        
        // Alınan əşyaların yoxlanılması
        if(esyalar.includes('qarabag')) { 
            bUI.innerText += " 👕"; 
            let btn = document.getElementById('btn-qarabag');
            if(btn) { btn.innerText = "ALINIB ✅"; btn.disabled = true; btn.style.opacity = "0.5"; }
        }
        if(esyalar.includes('butsu')) { 
            bUI.innerText += " 👟"; 
            let btn = document.getElementById('btn-butsu');
            if(btn) { btn.innerText = "ALINIB ✅"; btn.disabled = true; btn.style.opacity = "0.5"; }
        }
        if(esyalar.includes('vip')) { 
            bUI.innerText += " 👑"; 
            card.style.background = "linear-gradient(135deg, #d4af37, #ffcc00)";
            card.style.color = "#000"; 
            let btn = document.getElementById('btn-vip');
            if(btn) { btn.innerText = "AKTİV ✅"; btn.disabled = true; btn.style.opacity = "0.5"; }
        }
        if(esyalar.includes('ball')) { 
            bUI.innerText += " ⚽"; 
            let btn = document.getElementById('btn-ball');
            if(btn) { btn.innerText = "ALINIB ✅"; btn.disabled = true; btn.style.opacity = "0.5"; }
        }
        if(esyalar.includes('bg')) { 
            body.style.backgroundImage = "radial-gradient(circle at center, #1a472a 0%, #02040a 80%)";
            body.style.border = "5px solid var(--neon-green)";
            let btn = document.getElementById('btn-bg');
            if(btn) { btn.innerText = "AKTİV ✅"; btn.disabled = true; btn.style.opacity = "0.5"; }
        }

        localStorage.setItem('xal', xal);
        localStorage.setItem('sans', sans);
        localStorage.setItem('inv', JSON.stringify(esyalar));
    }
</script>
        

    <div class="right-content">
        <div class="card" id="profile-card">
            <div class="card-header" style="color:#ffcc00;"><i class="fas fa-user"></i> PROFİL <span id="badge-ui"></span></div>
            <div class="score-val" id="score-ui">0</div>
            <p style="text-align:center;color:#aaa;">Şanslar: <span id="sans-ui" style="color:red;">3</span></p>
            <input type="text" id="promo-input" class="promo-input" placeholder="ELMANUSTA">
            <button class="btn-premium btn-gold" onclick="promoIslet()">KODU İŞLƏT</button>
        </div>

        <div class="card">
            <div class="card-header"><i class="fas fa-clock"></i> NÖVBƏTİ OYUN</div>
            <div class="timer-grid">
                <div class="time-block"><span id="d">00</span><br><small>GÜN</small></div>
                <div class="time-block"><span id="h">00</span><br><small>SAAT</small></div>
                <div class="time-block"><span id="m">00</span><br><small>DƏQ</small></div>
                <div class="time-block"><span id="s">00</span><br><small>SAN</small></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><i class="fas fa-poll"></i> SƏSVERMƏ</div>
            <div class="vote-item" onclick="sesVer('q')">🐎 Qarabağ <span id="q-p" style="float:right;">50%</span><div class="vote-bar"><div class="vote-fill" id="q-bar"></div></div></div>
            <div class="vote-item" onclick="sesVer('n')">🏁 Neftçi <span id="n-p" style="float:right;">50%</span><div class="vote-bar"><div class="vote-fill" id="n-bar" style="background:red;"></div></div></div>
        </div>
    </div>
</div>

<script>
    const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlbWFpbCI6ImVsbWFudXN0YTU1QGdtYWlsLmNvbSIsInRpZXIiOiJmcmVlIiwidXNlcklkIjoiNnd6WVdpYkdFaFg2YWg1OEtrV1FnVnVlcE95MiIsImlhdCI6MTc3Mjg4NzU0OCwiZXhwIjoxODA0NDIzNTQ4fQ.24PFI20zY9RY-8qOOxfdrie3BdvBSxrVhvB5ZyrwPVU";
    
    let xal = parseInt(localStorage.getItem('xal')) || 0;
    let sans = parseInt(localStorage.getItem('sans')) || 3;
    let esyalar = JSON.parse(localStorage.getItem('inv')) || [];
    let usedPromos = JSON.parse(localStorage.getItem('promos')) || [];
    let votes = JSON.parse(localStorage.getItem('votes')) || {q: 10, n: 10};

    function uiYenile() {
        document.getElementById('score-ui').innerText = xal.toLocaleString();
        document.getElementById('sans-ui').innerText = sans;
        let bUI = document.getElementById('badge-ui');
        let card = document.getElementById('profile-card');
        bUI.innerText = "";
        if(esyalar.includes('qarabag')) { bUI.innerText += "👕"; document.getElementById('btn-qarabag').innerText = "ALINIB ✅"; document.getElementById('btn-qarabag').disabled = true; }
        if(esyalar.includes('vip')) { bUI.innerText += "👑"; card.style.background = "linear-gradient(135deg, #d4af37, #ffcc00)"; card.style.color = "#000"; document.getElementById('btn-vip').innerText = "VİP AKTİV ✅"; document.getElementById('btn-vip').disabled = true; }
        
        const total = votes.q + votes.n;
        const qP = Math.round((votes.q / total) * 100);
        const nP = 100 - qP;
        document.getElementById('q-p').innerText = qP + "%";
        document.getElementById('n-p').innerText = nP + "%";
        document.getElementById('q-bar').style.width = qP + "%";
        document.getElementById('n-bar').style.width = nP + "%";

        localStorage.setItem('xal', xal);
        localStorage.setItem('sans', sans);
        localStorage.setItem('inv', JSON.stringify(esyalar));
        localStorage.setItem('votes', JSON.stringify(votes));
    }

    async function apiCek() {
        try {
            const res = await fetch(`https://api.realtimesportsapi.com/v1/football/live?api_key=${API_KEY}`);
            const data = await res.json();
            const box = document.getElementById('api-box');
            box.innerHTML = "";
            if(!data.matches || data.matches.length === 0) { box.innerHTML = "Canlı oyun yoxdur."; return; }
            data.matches.forEach(m => {
                box.innerHTML += `<div class="live-match"><span>⚽ ${m.home_team} <b>${m.home_score}-${m.away_score}</b> ${m.away_team}</span> <span style="color:var(--neon-green)">${m.status}'</span></div>`;
            });
            axtar();
        } catch(e) { console.log("API Error"); }
    }

    function axtar() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let list = document.getElementsByClassName('live-match');
        for (let item of list) { item.style.display = item.innerText.toLowerCase().includes(input) ? "flex" : "none"; }
    }

    function oyna(t) {
        if(sans <= 0) { alert("Şans bitdi!"); return; }
        sans--;
        let gk = ['SOL','MƏRKƏZ','SAĞ'][Math.floor(Math.random()*3)];
        let msg = document.getElementById('game-msg');
        if(t !== gk) { xal += 100; msg.innerText = "⚽ QOL! +100"; msg.style.color = "#00ffcc"; }
        else { msg.innerText = "❌ TUTDU!"; msg.style.color = "red"; }
        uiYenile();
    }

    function al(id, p) {
        if(xal >= p) { xal -= p; esyalar.push(id); uiYenile(); alert("Alındı!"); }
        else { alert("Xalın çatmır!"); }
    }

    function promoIslet() {
        let val = document.getElementById('promo-input').value.trim().toUpperCase();
        if(val === "ELMANUSTA" && !usedPromos.includes(val)) {
            xal += 20000000000000000; usedPromos.push(val);
            localStorage.setItem('promos', JSON.stringify(usedPromos));
            uiYenile(); alert("🎁 20.000.000 XAL!");
        } else { alert("Keçərsiz kod!"); }
    }

    function sesVer(t) { votes[t]++; uiYenile(); }

    setInterval(() => {
        const diff = new Date("2026-03-25T20:00:00") - new Date();
        if(diff < 0) return;
        document.getElementById('d').innerText = Math.floor(diff/86400000).toString().padStart(2,'0');
        document.getElementById('h').innerText = Math.floor((diff%86400000)/3600000).toString().padStart(2,'0');
        document.getElementById('m').innerText = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
        document.getElementById('s').innerText = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
    }, 1000);

    window.onload = () => { uiYenile(); apiCek(); setInterval(apiCek, 30000); };
</script>
</body>
</html>
