<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol.Az - İşlək Versiya</title>
    <style>
        :root { --main: #00ff88; --bg: #0b0e14; --card: #161b22; --text: #ffffff; --gray: #8b949e; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); }
        header { background: #000; padding: 15px; border-bottom: 1px solid #30363d; text-align: center; }
        .logo { font-size: 24px; font-weight: 800; color: var(--main); }
        .container { max-width: 600px; margin: auto; padding: 15px; }
        
        .user-card { background: #1f2937; border-radius: 15px; padding: 20px; margin-bottom: 20px; text-align: center; border: 1px solid var(--main); }
        .bal-num { font-size: 32px; font-weight: 800; color: var(--main); }
        
        .card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid #30363d; text-align: center; margin-bottom: 15px; }
        
        .btn { background: var(--main); color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin: 5px 0; display: block; }
        .btn:active { background: #00cc6e; transform: scale(0.98); }
        .btn-outline { background: transparent; border: 1px solid var(--main); color: var(--main); }
        
        #game-msg { height: 20px; margin: 10px 0; font-weight: bold; }
        .ls-wrap { background: #fff; border-radius: 12px; overflow: hidden; margin-top: 20px; min-height: 400px; }
    </style>
</head>
<body>

    <header><div class="logo">FUTBOL.AZ</div></header>

    <div class="container">
        
        <div class="user-card">
            <div style="color: #aaa; font-size: 14px;">BALANSINIZ</div>
            <div class="bal-num" id="u-bal">0</div>
            <button class="btn" style="margin-top: 10px;" onclick="window.addPoints()">PROMOKOD DAXİL ET</button>
        </div>

        <div class="card">
            <div style="font-size: 14px; color: var(--gray);">Qalan Şans: <span id="ch-val">3</span></div>
            <h3>Qapıçıya Qol Vur!</h3>
            <div id="game-msg">Hazırlaş...</div>
            <button class="btn btn-outline" onclick="window.playGame('SOL')">SOLA VUR</button>
            <button class="btn btn-outline" onclick="window.playGame('MƏRKƏZ')">ORTAYA VUR</button>
            <button class="btn btn-outline" onclick="window.playGame('SAĞ')">SAĞA VUR</button>
        </div>

        <div class="card">
            <h3>Meqa Mağaza</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div style="border: 1px solid #333; padding: 10px; border-radius: 10px;">
                    <div>👕 Forma</div>
                    <div style="color: var(--main);">500 XAL</div>
                    <button id="btn-q1" class="btn" onclick="window.buyItem('q1', 500)">AL</button>
                </div>
                <div style="border: 1px solid #333; padding: 10px; border-radius: 10px;">
                    <div>👟 Butsi</div>
                    <div style="color: var(--main);">800 XAL</div>
                    <button id="btn-b1" class="btn" onclick="window.buyItem('b1', 800)">AL</button>
                </div>
            </div>
        </div>

        <div class="ls-wrap">
            <div id="ls-widget" data-w="ls_widget_65ca5b" class="ls-widget"></div>
            <script type="text/javascript" src="https://ls.livescore.in/active/js/ls_widget.js?v=1"></script>
            <script type="text/javascript">
                new LS_Widget("ls_widget_65ca5b", {"m": "1", "v": "1", "t": "dark", "s": "1", "l": "az"});
            </script>
        </div>

    </div>

    <script>
        // Dəyişənləri yükləyirik
        let score = localStorage.getItem('f_score') ? parseInt(localStorage.getItem('f_score')) : 0;
        let chances = localStorage.getItem('f_chances') ? parseInt(localStorage.getItem('f_chances')) : 3;
        let inv = localStorage.getItem('f_inv') ? JSON.parse(localStorage.getItem('f_inv')) : [];

        // UI Yeniləmə Funksiyası
        window.updateUI = function() {
            document.getElementById('u-bal').innerText = score.toLocaleString();
            document.getElementById('ch-val').innerText = chances;
            
            // Mağaza yoxlanışı
            inv.forEach(id => {
                let b = document.getElementById('btn-' + id);
                if (b) {
                    b.innerText = "ALINIB";
                    b.style.background = "#333";
                    b.disabled = true;
                }
            });

            localStorage.setItem('f_score', score);
            localStorage.setItem('f_chances', chances);
            localStorage.setItem('f_inv', JSON.stringify(inv));
        };

        // Oyun Funksiyası
        window.playGame = function(direction) {
            if (chances <= 0) {
                alert("Gündəlik 3 şansınız bitdi!");
                return;
            }

            const positions = ['SOL', 'MƏRKƏZ', 'SAĞ'];
            const gkPos = positions[Math.floor(Math.random() * 3)];
            const msg = document.getElementById('game-msg');

            chances--;

            if (direction === gkPos) {
                msg.innerText = "❌ Qapıçı tutdu! (O " + gkPos + " tərəfə tullandı)";
                msg.style.color = "#ff4d4d";
            } else {
                score += 100;
                msg.innerText = "⚽ QOOOL! +100 XAL (Qapıçı " + gkPos + " qaldı)";
                msg.style.color = "#00ff88";
            }
            window.updateUI();
        };

        // Mağaza Funksiyası
        window.buyItem = function(id, price) {
            if (score >= price) {
                score -= price;
                inv.push(id);
                window.updateUI();
                alert("Məhsul alındı!");
            } else {
                alert("Xalınız kifayət deyil!");
            }
        };

        // Promokod Funksiyası
        window.addPoints = function() {
            let code = prompt("Promokodu daxil edin:");
            if (code && code.toUpperCase() === "ELMANUSTA") {
                score += 5000;
                window.updateUI();
                alert("Təbrikler! 5000 XAL əlavə olundu!");
            } else if (code) {
                alert("Yanlış kod!");
            }
        };

        // Səhifə açılanda işə sal
        window.updateUI();
    </script>
</body>
</html>
