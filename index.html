<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol.Az | Canlı Hesablar Pro</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 20px;
        }

        #live-football-widget {
            width: 100%;
            max-width: 600px;
            margin: auto;
            background: #1e1e1e;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }

        .widget-header {
            background: linear-gradient(90deg, #1b5e20, #2e7d32);
            padding: 15px;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .match-card {
            background: #262626;
            margin: 10px;
            padding: 15px;
            border-radius: 12px;
            border-left: 5px solid #4caf50;
        }

        .match-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .team { flex: 1; font-weight: bold; font-size: 15px; }
        .home { text-align: right; margin-right: 10px; }
        .away { text-align: left; margin-left: 10px; }

        .score-area {
            text-align: center;
            min-width: 80px;
        }

        .score {
            font-size: 22px;
            background: #000;
            padding: 5px 10px;
            border-radius: 8px;
            color: #4caf50;
            display: block;
        }

        /* Qol vuranların siyahısı */
        .scorers {
            font-size: 12px;
            color: #bbb;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #3d3d3d;
            display: flex;
            justify-content: space-between;
        }

        .scorer-list { width: 45%; }

        /* Canlı Bax Düyməsi */
        .live-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: #d32f2f;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            transition: 0.3s;
        }

        .live-btn:hover { background: #ff5252; }

        .time-badge {
            font-size: 11px;
            color: #ff5252;
            font-weight: bold;
            animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

<div id="live-football-widget">
    <div class="widget-header">🏆 Canlı Oyunlar & Qolçular</div>
    <div id="live-scores-content">
        <p style="text-align:center; padding: 20px;">Yüklənir...</p>
    </div>
</div>

<script>
    const API_KEY = "5b40dc94de05e9a55e848b0c16da8e8c";

    async function updateScores() {
        try {
            const response = await fetch('https://v3.football.api-sports.io/fixtures?live=all', {
                method: 'GET',
                headers: { 'x-apisports-key': API_KEY }
            });
            const data = await response.json();
            const matches = data.response || [];

            if (matches.length === 0) {
                document.getElementById('live-scores-content').innerHTML = "<p style='text-align:center; padding:20px;'>Hazırda canlı oyun yoxdur.</p>";
                return;
            }

            let html = '';
            matches.forEach(match => {
                // Qol vuranları ayırırıq
                let homeScorers = [];
                let awayScorers = [];
                
                if (match.events) {
                    match.events.forEach(event => {
                        if (event.type === "Goal") {
                            let goalInfo = `${event.player.name} (${event.time.elapsed}')`;
                            if (event.team.id === match.teams.home.id) homeScorers.push(goalInfo);
                            else awayScorers.push(goalInfo);
                        }
                    });
                }

                const watchUrl = `https://www.google.com/search?q=${encodeURIComponent(match.teams.home.name + ' vs ' + match.teams.away.name + ' canlı izlə')}`;

                html += `
                    <div class="match-card">
                        <div class="match-info">
                            <div class="team home">${match.teams.home.name}</div>
                            <div class="score-area">
                                <span class="score">${match.goals.home} - ${match.goals.away}</span>
                                <span class="time-badge">${match.fixture.status.elapsed}'</span>
                            </div>
                            <div class="team away">${match.teams.away.name}</div>
                        </div>

                        <div class="scorers">
                            <div class="scorer-list" style="text-align: right;">${homeScorers.join(', ')}</div>
                            <div style="color:#555">⚽</div>
                            <div class="scorer-list">${awayScorers.join(', ')}</div>
                        </div>

                        <a href="${watchUrl}" target="_blank" class="live-btn">📺 CANLI BAX</a>
                    </div>
                `;
            });

            document.getElementById('live-scores-content').innerHTML = html;
        } catch (e) {
            console.error(e);
        }
    }

    updateScores();
    setInterval(updateScores, 60000); // 1 dəqiqədən bir yenilə
</script>

</body>
</html>
