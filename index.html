<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol.Az - Meqa Yenilənmə v2.0</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1c2c">

    <style>
        body { background:#0b1c2c; font-family:'Segoe UI', Tahoma, sans-serif; color:white; padding:15px; margin: 0; }
        .card { background:#1e2f45; padding:20px; margin-bottom:15px; border-radius:12px; border: 1px solid #2d425d; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { color:#4fc3f7; margin-top: 0; border-bottom: 2px solid #0b1c2c; padding-bottom: 8px; font-size: 18px; text-transform: uppercase; }
        
        /* TAYMER STİLİ */
        .timer-box { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
        .time-unit { background: #0b1c2c; padding: 10px; border-radius: 8px; min-width: 50px; text-align: center; border: 1px solid #4fc3f7; }
        .time-val { font-size: 22px; font-weight: bold; color: #f1c40f; display: block; }
        .time-label { font-size: 10px; text-transform: uppercase; color: #aaa; }

        /* SƏSVERMƏ STİLİ */
        .vote-btn { width: 100%; background: #0b1c2c; color: white; border: 1px solid #4fc3f7; padding: 10px; border-radius: 8px; margin: 5px 0; cursor: pointer; transition: 0.3s; }
        .vote-btn:hover { background: #4fc3f7; color: #000; }
        .vote-res { height: 8px; background: #4fc3f7; border-radius: 4px; margin-top: 5px; width: 0%; transition: 1s; }

        /* DÜYMƏLƏR */
        .btn { background: #4fc3f7; color: #000; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; font-size: 14px; }
        .input-search { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #4fc3f7; background: #0b1c2c; color: #fff; box-sizing: border-box; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔍 Qlobal Axtarış</h2>
        <input type="text" class="input-search" placeholder="Komanda və ya Liqa axtar...">
        <p style="font-size:12px; color:#aaa;">Top 5 liqa və Premyer Liqa nəticələri daxildir.</p>
    </div>

    <div class="card" style="text-align: center;">
        <h2>⏳ Qarabağın Növbəti Oyunu</h2>
        <p id="match-name" style="font-weight: bold; margin-bottom: 5px;">Qarabağ - Neftçi</p>
        <div class="timer-box">
            <div class="time-unit"><span class="time-val" id="days">00</span><span class="time-label">Gün</span></div>
            <div class="time-unit"><span class="time-val" id="hours">00</span><span class="time-label">Saat</span></div>
            <div class="time-unit"><span class="time-val" id="mins">00</span><span class="time-label">Dəq</span></div>
            <div class="time-unit"><span class="time-val" id="secs">00</span><span class="time-label">San</span></div>
        </div>
    </div>

    <div class="card">
        <h2>💬 Kim Qalib Gələcək?</h2>
        <p style="font-size: 14px;">Qarabağ - Neftçi matçı üçün təxminin:</p>
        <button class="vote-btn" onclick="vote('q')">Qarabağ <span id="q-percent">0%</span></button>
        <div class="vote-res" id="q-bar"></div>
        <button class="vote-btn" onclick="vote('n')">Neftçi <span id="n-percent">0%</span></button>
        <div class="vote-res" id="n-bar" style="background: #e74c3c;"></div>
    </div>

    <div class="card">
        <h2>📺 Canlı TV (Yayımlar)</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <a href="https://www.selcuksportshd.is/" target="_blank" class="btn" style="text-align:center;">Selcuk Sports</a>
            <a href="https://cbc-sport.az/live" target="_blank" class="btn" style="text-align:center; background:#f1c40f;">CBC Sport</a>
        </div>
    </div>

    <div class="card">
        <h2>📊 Premyer Liqa Cədvəli</h2>
        <iframe src="https://www.scorebat.com/embed/league/azerbaijan-premyer-liga/" style="width:100%; height:400px; border:none; border-radius:8px;"></iframe>
    </div>

    <script>
        // TAYMER MƏNTİQİ (Növbəti oyunun tarixini bura yaz)
        const matchDate = new Date("March 25, 2026 20:00:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const diff = matchDate - now;

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d < 10 ? "0"+d : d;
            document.getElementById("hours").innerText = h < 10 ? "0"+h : h;
            document.getElementById("mins").innerText = m < 10 ? "0"+m : m;
            document.getElementById("secs").innerText = s < 10 ? "0"+s : s;
        }
        setInterval(updateTimer, 1000);

        // SƏSVERMƏ MƏNTİQİ
        let votes = JSON.parse(localStorage.getItem('futbol_votes')) || { q: 10, n: 5 };
        function updateVoteUI() {
            const total = votes.q + votes.n;
            const qP = Math.round((votes.q / total) * 100);
            const nP = Math.round((votes.n / total) * 100);

            document.getElementById('q-percent').innerText = qP + "%";
            document.getElementById('n-percent').innerText = nP + "%";
            document.getElementById('q-bar').style.width = qP + "%";
            document.getElementById('n-bar').style.width = nP + "%";
            localStorage.setItem('futbol_votes', JSON.stringify(votes));
        }
        function vote(team) {
            votes[team]++;
            updateVoteUI();
        }
        updateVoteUI();

        // PWA QEYDİYYATI
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW error:', err));
            });
        }
    </script>
</body>
</html>
