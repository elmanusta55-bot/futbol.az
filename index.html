<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Futbol.Az</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white
}

header{
background:#020617;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center
}

.logo{
font-size:22px;
font-weight:bold;
color:#22c55e
}

.menu a{
margin-left:15px;
color:white
}

.section{
max-width:900px;
margin:20px auto;
background:#1e293b;
padding:20px;
border-radius:10px
}

.section h2{
margin-top:0;
color:#38bdf8
}

.match{
background:#0f172a;
padding:10px;
border-radius:8px;
margin-bottom:8px;
display:flex;
justify-content:space-between
}

.table{
width:100%;
border-collapse:collapse
}

.table th,.table td{
padding:8px;
border-bottom:1px solid #334155;
text-align:center
}

input{
width:100%;
padding:10px;
border-radius:6px;
border:none;
margin-bottom:10px
}

footer{
text-align:center;
padding:15px;
background:#020617;
margin-top:20px
}

</style>
</head>

<body>

<header>

<div class="logo">⚽ Futbol.Az</div>

<div class="menu">
<a href="#today">Oyunlar</a>
<a href="#live">Canlı</a>
<a href="#table">Cədvəl</a>
<a href="#transfer">Transfer</a>
</div>

</header>


<div class="section">

<input id="search" placeholder="🔍 Komanda axtar...">

</div>


<section id="today" class="section">

<h2>📅 Günün Oyunları</h2>

<div id="todayMatches">Yüklənir...</div>

</section>


<section id="live" class="section">

<h2>🔴 Canlı Hesablar</h2>

<div id="liveMatches">Yüklənir...</div>

</section>


<section id="table" class="section">

<h2>📊 Turnir Cədvəli</h2>

<table class="table">

<thead>
<tr>
<th>#</th>
<th>Komanda</th>
<th>O</th>
<th>X</th>
<th>M</th>
<th>P</th>
</tr>
</thead>

<tbody id="standings"></tbody>

</table>

</section>


<section id="transfer" class="section">

<h2>💰 Son Transferlər</h2>

<div id="transfers">Yüklənir...</div>

</section>


<section class="section">

<h2>📺 Canlı TV</h2>

<div class="match">
<a target="_blank" href="https://selcuksportshd.tv">SelçukSports</a>
</div>

<div class="match">
<a target="_blank" href="https://scorebat.com">Scorebat</a>
</div>

</section>


<footer>

© 2026 Futbol.Az

</footer>


<script>

const API="https://api.sportmonks.com/v3/football";
const KEY="VWu2sDI43xzsqIX3";


async function todayMatches(){

let today=new Date().toISOString().split("T")[0]

let r=await fetch(API+"/fixtures/date/"+today+"?api_token="+KEY+"&include=participants")

let d=await r.json()

let box=document.getElementById("todayMatches")

box.innerHTML=""

d.data.slice(0,10).forEach(m=>{

let home=m.participants[0].name
let away=m.participants[1].name

box.innerHTML+=`
<div class="match">
${home} - ${away}
</div>
`

})

}


async function liveMatches(){

let r=await fetch(API+"/livescores?api_token="+KEY+"&include=participants")

let d=await r.json()

let box=document.getElementById("liveMatches")

box.innerHTML=""

d.data.forEach(m=>{

let home=m.participants[0].name
let away=m.participants[1].name

box.innerHTML+=`
<div class="match">
${home} vs ${away}
</div>
`

})

}


async function standings(){

let r=await fetch(API+"/standings/seasons/21646?api_token="+KEY)

let d=await r.json()

let box=document.getElementById("standings")

d.data[0].standings.data.slice(0,10).forEach(t=>{

box.innerHTML+=`
<tr>
<td>${t.position}</td>
<td>${t.participant.name}</td>
<td>${t.played}</td>
<td>${t.won}</td>
<td>${t.lost}</td>
<td>${t.points}</td>
</tr>
`

})

}


async function transfers(){

let r=await fetch(API+"/transfers?api_token="+KEY)

let d=await r.json()

let box=document.getElementById("transfers")

box.innerHTML=""

d.data.slice(0,10).forEach(t=>{

box.innerHTML+=`
<div class="match">
${t.player_name}
</div>
`

})

}


todayMatches()

liveMatches()

standings()

transfers()


document.getElementById("search").addEventListener("input",function(){

let v=this.value.toLowerCase()

document.querySelectorAll(".match").forEach(e=>{

e.style.display=e.innerText.toLowerCase().includes(v)?"flex":"none"

})

})

</script>

</body>
</html>
