<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Live Futbol</title>

<style>

body{
background:#0b1c2c;
font-family:Arial;
margin:0;
padding:20px;
color:white;
}

header{
text-align:center;
margin-bottom:20px;
}

h1{
color:#4fc3f7;
}

.card{
background:#1e2f45;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

.match{
display:flex;
justify-content:space-between;
align-items:center;
background:#0f2a44;
padding:12px;
margin:8px 0;
border-radius:8px;
}

.team{
font-weight:bold;
}

.score{
font-size:20px;
color:#f1c40f;
font-weight:bold;
}

.status{
font-size:13px;
color:#2ecc71;
}

</style>

</head>
<body>

<header>
<h1>⚽ Futbol Canlı Hesablar</h1>
</header>

<div class="card">

<h2>🔴 Canlı Oyunlar</h2>

<div id="live">
Yüklənir...
</div>

</div>


<script>

const API_TOKEN="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlbWFpbCI6ImVsbWFudXN0YTU1QGdtYWlsLmNvbSIsInRpZXIiOiJmcmVlIiwidXNlcklkIjoiNnd6WVdpYkdFaFg2YWg1OEtrV1FnVnVlcE95MiIsImlhdCI6MTc3Mjg4NzU0OCwiZXhwIjoxODA0NDIzNTQ4fQ.24PFI20zY9RY-8qOOxfdrie3BdvBSxrVhvB5ZyrwPVU"


async function loadLive(){

const box=document.getElementById("live")

try{

const res=await fetch("https://realtimesportsapi.com/api/v1/sports/football/leagues/nfl/events/live",{

headers:{
"Authorization":"Bearer "+API_TOKEN
}

})

const data=await res.json()

box.innerHTML=""

if(!data.events){

box.innerHTML="Canlı oyun yoxdur"

return

}

data.events.forEach(game=>{

box.innerHTML+=`

<div class="match">

<div class="team">${game.homeTeam?.name}</div>

<div class="score">${game.homeScore ?? 0} - ${game.awayScore ?? 0}</div>

<div class="team">${game.awayTeam?.name}</div>

<div class="status">${game.status ?? ""}</div>

</div>

`

})

}catch(e){

box.innerHTML="Oyunlar yüklənmədi"

}

}

loadLive()

setInterval(loadLive,30000)

</script>

</body>
</html>
