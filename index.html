<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol.Az | Premium Canlı Hesablar və Təqvim</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        pitchGreen: '#2ecc71',
                        darkBg: '#0b0f19',
                        cardBg: 'rgba(30, 41, 59, 0.6)'
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0b0f19;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b0f19 70%);
            color: white;
            min-height: 100vh;
        }
        /* Glassmorphism Effekti */
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .glass-card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px -10px rgba(46, 204, 113, 0.3);
            border-color: rgba(46, 204, 113, 0.4);
        }
        .upcoming-row:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }
        /* Canlı işıq effekti */
        .live-pulse {
            box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
        .loader {
            border-top-color: #2ecc71;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .text-truncate {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body class="antialiased pb-12">

<header class="sticky top-0 z-50 glass-card border-b-0 border-white/10 mb-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 bg-pitchGreen rounded-full live-pulse"></div>
                <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">
                    Futbol<span class="text-pitchGreen">.Az</span>
                </h1>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="hidden md:block text-sm text-gray-400" id="last-update-time">
                    Yüklənir...
                </div>
                <button onclick="refreshScores()" id="refresh-btn" class="bg-white/10 hover:bg-white/20 border border-white/10 px-4 py-2 rounded-xl flex items-center gap-2 transition-all duration-300">
                    <svg id="refresh-icon" class="w-5 h-5 text-pitchGreen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span id="refresh-text" class="font-medium hidden sm:block">Yenilə</span>
                </button>
            </div>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <div id="loading-indicator" class="flex flex-col items-center justify-center py-20">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-700 h-16 w-16 mb-4"></div>
        <p class="text-gray-400 font-medium text-lg animate-pulse">Oyunlar yüklənir...</p>
    </div>

    <div id="main-content" class="hidden">
        
        <!-- CANLI OYUNLAR BÖLMƏSİ -->
        <div class="mb-12">
            <div class="flex items-center gap-2 mb-6">
                <span class="w-3 h-3 rounded-full bg-pitchGreen live-pulse"></span>
                <h2 class="text-2xl font-bold uppercase tracking-wide">Canlı Oyunlar</h2>
            </div>
            
            <div id="empty-live-state" class="hidden flex flex-col items-center justify-center py-10 text-center glass-card rounded-2xl w-full">
                <div class="text-4xl mb-2 opacity-50">⚽</div>
                <h3 class="text-xl font-bold mb-1">Hazırda canlı oyun yoxdur</h3>
                <p class="text-gray-400 text-sm">Günün proqramı üçün aşağıya baxın.</p>
            </div>

            <div id="live-scores-content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Canlı oyunlar bura yüklənəcək -->
            </div>
        </div>

        <!-- GÜNÜN PROQRAMI BÖLMƏSİ (TƏQVİM) -->
        <div>
            <div class="flex items-center gap-2 mb-6">
                <span class="text-2xl">📅</span>
                <h2 class="text-2xl font-bold uppercase tracking-wide">Günün Proqramı</h2>
            </div>

            <div id="empty-upcoming-state" class="hidden py-6 text-center text-gray-400 glass-card rounded-2xl w-full">
                Bu gün üçün planlaşdırılmış başqa oyun yoxdur.
            </div>

            <div id="upcoming-scores-content" class="flex flex-col gap-3 max-w-4xl">
                <!-- Təqvim oyunları bura yüklənəcək -->
            </div>
        </div>

    </div>
</main>

<script>
    const API_KEY = "5b40dc94de05e9a55e848b0c16da8e8c";
    let isRefreshing = false;
    
    async function refreshScores() {
        if (isRefreshing) return;
        isRefreshing = true;
        
        const refreshIcon = document.getElementById('refresh-icon');
        const refreshText = document.getElementById('refresh-text');
        
        refreshIcon.classList.add('animate-spin');
        if(refreshText) refreshText.textContent = 'Yenilənir...';
        
        try {
            await fetchMatches();
            updateLastRefreshTime();
        } catch (error) {
            console.error('Refresh xətası:', error);
        } finally {
            setTimeout(() => {
                refreshIcon.classList.remove('animate-spin');
                if(refreshText) refreshText.textContent = 'Yenilə';
                isRefreshing = false;
            }, 1000);
        }
    }

    async function fetchMatches() {
        const today = new Date().toISOString().split('T')[0]; // Format: YYYY-MM-DD
        
        try {
            // Həm canlı, həm də günün təqvimini bir API sorğusu ilə çəkirik
            const response = await fetch(`https://v3.football.api-sports.io/fixtures?date=${today}`, {
                method: 'GET',
                headers: { 'x-apisports-key': API_KEY }
            });
            
            const data = await response.json();
            const matches = data.response || [];

            document.getElementById('loading-indicator').style.display = 'none';
            document.getElementById('main-content').classList.remove('hidden');

            // Oyunları statuslarına görə ayırırıq
            const liveStatuses = ['1H', '2H', 'HT', 'ET', 'BT', 'P', 'SUSP', 'INT', 'LIVE'];
            const upcomingStatuses = ['NS', 'TBD']; // NS = Not Started (Başlamayıb)

            const liveMatches = matches.filter(m => liveStatuses.includes(m.fixture.status.short));
            const upcomingMatches = matches.filter(m => upcomingStatuses.includes(m.fixture.status.short))
                                           .sort((a, b) => new Date(a.fixture.date) - new Date(b.fixture.date)); // Saata görə sıralama

            renderLiveMatches(liveMatches);
            renderUpcomingMatches(upcomingMatches);

        } catch (error) {
            console.error('API Error:', error);
            document.getElementById('loading-indicator').innerHTML = '<p class="text-red-400">Məlumatları yükləmək mümkün olmadı.</p>';
        }
    }

    function renderLiveMatches(matches) {
        const container = document.getElementById('live-scores-content');
        const emptyState = document.getElementById('empty-live-state');

        if (matches.length === 0) {
            container.innerHTML = '';
            emptyState.classList.remove('hidden');
            return;
        }

        emptyState.classList.add('hidden');
        let html = '';

        matches.forEach(match => {
            let homeScorers = [];
            let awayScorers = [];
            
            if (match.events) {
                match.events.forEach(event => {
                    if (event.type === "Goal") {
                        let goalInfo = `<span class="text-gray-300">${event.player.name}</span> <span class="text-pitchGreen text-xs">(${event.time.elapsed}')</span>`;
                        if (event.team.id === match.teams.home.id) homeScorers.push(goalInfo);
                        else awayScorers.push(goalInfo);
                    }
                });
            }

            const watchUrl = `https://www.google.com/search?q=${encodeURIComponent(match.teams.home.name + ' vs ' + match.teams.away.name + ' canlı izlə')}`;

            html += `
                <div class="glass-card glass-card-hover rounded-2xl overflow-hidden flex flex-col justify-between">
                    <div class="flex justify-between items-center p-4 border-b border-white/5 bg-white/5">
                        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider text-truncate pr-2">${match.league.name}</span>
                        <div class="flex items-center gap-2 bg-pitchGreen/10 px-3 py-1 rounded-full border border-pitchGreen/20">
                            <span class="w-2 h-2 rounded-full bg-pitchGreen live-pulse"></span>
                            <span class="text-pitchGreen font-bold text-sm">${match.fixture.status.elapsed}'</span>
                        </div>
                    </div>
                    
                    <div class="p-6">
                        <div class="flex justify-between items-center mb-6">
                            <div class="flex flex-col items-center w-1/3">
                                <img src="${match.teams.home.logo}" alt="${match.teams.home.name}" class="w-14 h-14 object-contain mb-2 drop-shadow-lg">
                                <span class="text-center font-semibold text-sm text-truncate w-full">${match.teams.home.name}</span>
                            </div>
                            
                            <div class="flex flex-col items-center justify-center w-1/3">
                                <div class="text-4xl font-extrabold tracking-tighter">
                                    ${match.goals.home} <span class="text-gray-500 font-medium">-</span> ${match.goals.away}
                                </div>
                            </div>
                            
                            <div class="flex flex-col items-center w-1/3">
                                <img src="${match.teams.away.logo}" alt="${match.teams.away.name}" class="w-14 h-14 object-contain mb-2 drop-shadow-lg">
                                <span class="text-center font-semibold text-sm text-truncate w-full">${match.teams.away.name}</span>
                            </div>
                        </div>

                        ${(homeScorers.length > 0 || awayScorers.length > 0) ? `
                        <div class="flex justify-between text-xs mt-4 pt-4 border-t border-white/5">
                            <div class="w-1/2 pr-2 text-left space-y-1">${homeScorers.join('<br>')}</div>
                            <div class="w-1/2 pl-2 text-right space-y-1">${awayScorers.join('<br>')}</div>
                        </div>
                        ` : ''}
                    </div>

                    <div class="p-4 pt-0">
                        <a href="${watchUrl}" target="_blank" class="block w-full py-3 rounded-xl bg-white/5 hover:bg-pitchGreen text-center font-bold text-sm transition-colors duration-300 border border-white/10 hover:border-pitchGreen">
                            📺 CANLI BAX
                        </a>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function renderUpcomingMatches(matches) {
        const container = document.getElementById('upcoming-scores-content');
        const emptyState = document.getElementById('empty-upcoming-state');

        if (matches.length === 0) {
            container.innerHTML = '';
            emptyState.classList.remove('hidden');
            return;
        }

        emptyState.classList.add('hidden');
        let html = '';

        // Ekranda həddən artıq oyun olmasın deyə maksimum ilk 30 oyunu göstəririk
        const matchesToShow = matches.slice(0, 30);

        matchesToShow.forEach(match => {
            const time = new Date(match.fixture.date).toLocaleTimeString('az-AZ', { hour: '2-digit', minute: '2-digit' });
            
            html += `
                <div class="upcoming-row glass-card p-4 rounded-xl border border-white/5 flex flex-col sm:flex-row justify-between items-center transition-all duration-300 gap-4">
                    
                    <div class="flex items-center gap-4 w-full sm:w-auto">
                        <span class="font-bold text-pitchGreen text-lg bg-pitchGreen/10 px-3 py-1 rounded-lg">${time}</span>
                        <div class="hidden sm:block w-px h-8 bg-white/10"></div>
                        <span class="text-xs text-gray-400 sm:hidden">${match.league.name}</span>
                    </div>

                    <div class="flex items-center justify-center gap-4 w-full sm:flex-1">
                        <div class="flex items-center gap-2 justify-end w-2/5">
                            <span class="font-semibold text-sm text-right hidden sm:block">${match.teams.home.name}</span>
                            <span class="font-semibold text-sm text-right sm:hidden text-truncate">${match.teams.home.name.substring(0,3).toUpperCase()}</span>
                            <img src="${match.teams.home.logo}" alt="" class="w-6 h-6 object-contain">
                        </div>
                        
                        <span class="text-gray-500 font-bold text-sm w-1/5 text-center">VS</span>
                        
                        <div class="flex items-center gap-2 justify-start w-2/5">
                            <img src="${match.teams.away.logo}" alt="" class="w-6 h-6 object-contain">
                            <span class="font-semibold text-sm text-left hidden sm:block">${match.teams.away.name}</span>
                            <span class="font-semibold text-sm text-left sm:hidden text-truncate">${match.teams.away.name.substring(0,3).toUpperCase()}</span>
                        </div>
                    </div>

                    <div class="hidden sm:flex items-center justify-end w-1/4">
                        <span class="text-xs text-gray-400 text-right text-truncate">${match.league.name}</span>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }
    
    function updateLastRefreshTime() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('az-AZ', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        document.getElementById('last-update-time').textContent = `Son yenilənmə: ${timeString}`;
    }

    // Başlanğıc yüklənmə
    fetchMatches();
    updateLastRefreshTime();
    
    // Hər 60 saniyədən bir avtomatik yenilənmə (API limitini qorumaq üçün 30-dan 60-a qaldırıldı)
    setInterval(() => {
        if (!isRefreshing) {
            fetchMatches();
            updateLastRefreshTime();
        }
    }, 60000);
</script>

</body>
</html>
